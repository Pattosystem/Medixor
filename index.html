<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medixor 営業PDCA</title>
<style>
:root{
  --paper:#FFF7F0; --surface:#FFFFFF;
  --ink:#241C33; --ink2:#6B6280; --ink3:#8A81A0;
  --line:#F3E6DA; --line2:#FBF2EA;

  --pri:#3DDC97;  --pri-d:#2FD196; --pri-s:#DBF7EC; --pri-t:#0B7A5A; --pri-ink:#0B3D2E;
  --brand:#FF6B35; --brand-s:#FFEADF; --brand-t:#C2410C;
  --sun:#FFD43B;  --sun-s:#FFF3D6; --sun-t:#8A6100;
  --hot:#FF3D71;  --hot-s:#FFE4EC; --hot-t:#C2255C;
  --sky:#4C7DFF;  --sky-s:#E4EBFF; --sky-t:#3B5BDB;
  --grape:#8B5CF6;--grape-s:#EFE7FF; --grape-t:#6D3FD1;
  --tan:#FF8A50;  --tan-s:#FFF0DC; --tan-t:#B35309;
  --stop:#C2255C; --gold:#8A6100;

  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono","Courier New",monospace;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--jp);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
body{padding-bottom:60px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--pri)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

/* ── top bar ───────────────────────────── */
.top{position:sticky;top:0;z-index:40;background:rgba(245,247,245,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:22px;padding:12px 20px;max-width:1160px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;flex-shrink:0}
.brand b{font-size:16px;letter-spacing:.02em;font-weight:800}
.brand span{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase}
.rail{display:flex;gap:2px;flex:1;min-width:200px;align-items:center}
.rail i{height:6px;flex:1;border-radius:20px;background:var(--line);position:relative}
.rail i.w1{background:var(--pri)}.rail i.w2{background:var(--sky)}.rail i.w3{background:var(--grape)}
.rail i.past{opacity:.42}
.rail i.now{height:12px;background:var(--brand);box-shadow:0 0 0 3px var(--brand-s)}
.railcap{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.08em;white-space:nowrap}
.ring{display:flex;align-items:center;gap:9px;flex-shrink:0}
.ring svg{display:block}
.ring .rt{font-family:var(--mono);font-size:11px;color:var(--ink2);line-height:1.35;white-space:nowrap}
.ring .rt b{font-size:15px;color:var(--ink);font-weight:700}

.tabs{display:flex;gap:0;border-top:1px solid var(--line2);background:var(--surface)}
.tabs-in{display:flex;max-width:1160px;margin:0 auto;padding:0 12px;width:100%;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{padding:11px 15px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:600;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand-t);border-bottom-color:var(--brand)}
.tab em{font-family:var(--mono);font-style:normal;font-size:10px;background:var(--line2);padding:1px 6px;border-radius:20px;color:var(--ink2)}
.tab.on em{background:var(--brand-s);color:var(--brand-t)}
.tab em.hot{background:var(--hot);color:#fff}

main{padding:26px 0 40px}
.view{display:none}.view.on{display:block}

/* ── generic bits ──────────────────────── */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-t);font-weight:700;margin-bottom:9px}
h2.sec{font-size:19px;font-weight:800;letter-spacing:.01em;margin-bottom:4px}
.sub{color:var(--ink2);font-size:13px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.muted{color:var(--ink2)}
.tiny{font-size:12px}
hr.d{border:0;border-top:1px solid var(--line2);margin:16px 0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink);transition:.12s}
.btn:hover{border-color:var(--brand)}
.btn.p{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);box-shadow:0 2px 0 var(--pri-t)}
.btn.p:hover{background:var(--pri-d)}
.btn.p:active{transform:translateY(1px);box-shadow:0 1px 0 var(--pri-t)}
.btn.h{background:var(--sun);border-color:var(--sun);color:var(--ink);box-shadow:0 2px 0 var(--sun-t)}
.btn.h:hover{filter:brightness(1.04)}
.btn.h:active{transform:translateY(1px);box-shadow:0 1px 0 var(--sun-t)}
.btn.danger{color:var(--hot-t);border-color:var(--hot-s)}
.btn.danger:hover{background:var(--hot-s);border-color:var(--hot)}
.btn.s{padding:5px 10px;font-size:12px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.chip.g{background:var(--pri-s);color:var(--pri-t)}
.chip.h{background:var(--tan-s);color:var(--tan-t)}
.chip.r{background:var(--hot-s);color:var(--hot-t)}
.chip.y{background:var(--sun-s);color:var(--sun-t)}
.chip.c1{background:var(--pri-s);color:var(--pri-t)}
.chip.c2{background:var(--grape-s);color:var(--grape-t)}
.chip.c3{background:var(--sky-s);color:var(--sky-t)}
.chip.c4{background:var(--tan-s);color:var(--tan-t)}
.chip.c5{background:var(--brand-s);color:var(--brand-t)}
.chip.c6{background:var(--line2);color:var(--ink2)}
.chip.c7{background:var(--sun-s);color:var(--sun-t)}

/* ── focus card ────────────────────────── */
.focus{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:0 1px 2px rgba(20,27,24,.04),0 8px 24px -18px rgba(20,27,24,.3)}
.focus.hot{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-s)}
.fh{padding:16px 22px;border-bottom:1px solid var(--line2);display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.fh .act{font-size:12px;letter-spacing:.02em;color:var(--pri-ink);background:var(--pri);padding:5px 13px;border-radius:20px;font-weight:800}
.fh .act.hot{background:var(--sun);color:var(--ink)}
.fh .act.late{background:var(--hot-s);color:var(--hot-t)}
.fname{font-size:22px;font-weight:800;letter-spacing:.005em;line-height:1.35}
.fmeta{font-size:12px;color:var(--ink2);margin-top:3px}
.fb{padding:18px 22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:74px 1fr;gap:4px 12px;font-size:13px}
.kv dt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.06em;padding-top:4px}
.kv dd{color:var(--ink)}
.quote{background:var(--paper);border-left:3px solid var(--brand);border-radius:0 10px 10px 0;padding:11px 14px;font-size:13px;line-height:1.75}
.quote b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink3);font-weight:600;margin-bottom:2px}
.quote + .quote{margin-top:8px}

.mailbox{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.mailbar{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.mailbar .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink3)}
.subj{width:100%;border:0;border-bottom:1px solid var(--line2);padding:10px 13px;font-size:13.5px;font-weight:700;background:var(--surface);outline:none}
.subj:focus{background:#FFFDF9}
.bodyta{width:100%;border:0;padding:13px;font-size:13px;line-height:1.85;resize:vertical;min-height:340px;background:var(--surface);outline:none;font-family:var(--jp)}
.bodyta:focus{background:#FFFDF9}
.blanks{font-size:11.5px;color:var(--hot-t);font-weight:700;font-family:var(--mono);border:0;background:none;padding:0}
.blanks:hover{text-decoration:underline}
.blanks.ok{color:var(--pri-t)}

.memota{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 13px;min-height:84px;resize:vertical;font-size:13px;line-height:1.75;outline:none;background:var(--surface);font-family:var(--jp)}
.memota:focus{border-color:var(--brand)}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line2);background:var(--paper)}

.qlist{margin-top:22px}
.qrow{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13px}
.qrow:hover{background:var(--surface)}
.qrow .qd{font-family:var(--mono);font-size:11px;width:78px;flex-shrink:0;color:var(--ink3)}
.qrow .qd.late{color:var(--hot-t);font-weight:700}
.qrow .qn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.qrow .qa{font-size:11.5px;color:var(--ink2);flex-shrink:0}

/* ── stats ─────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats.c5{grid-template-columns:repeat(5,1fr)}
@media(max-width:900px){.stats,.stats.c5{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);padding:15px 17px}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--brand-t);text-transform:uppercase;font-weight:700}
.stat .n{font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .s{font-size:11.5px;color:var(--ink2)}
.stat .n.hot{color:var(--hot-t)}
.stat .n.g{color:var(--pri-t)}

table.t{width:100%;border-collapse:collapse;font-size:13px;line-height:1.55}
table.t th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink3);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tbody tr:nth-child(even){background:#FFFCF8}
table.t tbody tr:hover{background:var(--brand-s)}
table.t td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar{height:9px;border-radius:20px;background:var(--line2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--sky));border-radius:20px}
.bar i.low{background:#DCD6E4}

/* ── list ──────────────────────────────── */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12.5px;background:var(--surface);outline:none}
.filters input{min-width:190px}
.filters select:focus,.filters input:focus{border-color:var(--brand)}
.lrow{cursor:pointer}
.pill{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:20px;background:var(--line2);color:var(--ink2);white-space:nowrap;font-weight:700}

/* ── drawer ────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(20,27,24,.35);z-index:60;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(740px,100%);background:var(--paper);z-index:61;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:none}
.drawer.on{display:block;transform:translateX(0)}
.dclose{position:sticky;top:0;background:var(--paper);padding:12px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
.dbody{padding:18px 20px 60px}
#drawer .grid2{grid-template-columns:1fr}
#drawer .focus{box-shadow:none}

/* ── review ────────────────────────────── */
.pdca{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.pdca{grid-template-columns:1fr}}
.pdca .box{border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.pdca .box h4{font-size:12.5px;padding:9px 13px;background:var(--paper);border-bottom:1px solid var(--line);font-weight:700;display:flex;gap:8px;align-items:baseline}
.pdca .box h4 i{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--brand);letter-spacing:.14em;font-weight:700}
.pdca textarea{width:100%;border:0;padding:12px 13px;min-height:110px;resize:vertical;font-size:13px;line-height:1.75;outline:none;background:var(--surface);font-family:var(--jp)}

.acc{border:1px solid var(--line);border-radius:9px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.acc>summary{padding:12px 16px;font-weight:700;font-size:13.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"＋";font-family:var(--mono);color:var(--brand);font-size:15px;font-weight:700}
.acc[open]>summary::after{content:"−"}
.acc[open]>summary{border-bottom:1px solid var(--line2)}
.accb{padding:14px 16px}

.note{border-left:3px solid var(--hot);background:var(--hot-s);padding:11px 14px;border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:.2s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:56px 20px;color:var(--ink2)}
.empty .big{font-size:40px;font-family:var(--mono);color:var(--pri-t);font-weight:700}
@media(max-width:640px){
  .top-in{padding:10px 16px;gap:10px}
  .top-in>div:nth-child(2){order:3;flex-basis:100%;min-width:0}
  .ring{margin-left:auto}
  .wrap{padding:0 14px}
  .fh,.fb,.acts{padding-left:16px;padding-right:16px}
  .fname{font-size:19px}
  .stat{padding:12px 14px}.stat .n{font-size:23px}
  .acts .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#gate{position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.gbox{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 26px;box-shadow:0 20px 50px -30px rgba(20,27,24,.4)}
.gbox input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:9px;font-size:14px;outline:none;background:var(--surface)}
.gbox input:focus{border-color:var(--brand)}
</style>
</head>
<body>

<div id="gate">
  <form class="gbox" onsubmit="doLogin();return false">
    <div class="brand" style="justify-content:center;margin-bottom:4px"><b>Medixor</b><span>outbound&nbsp;pdca</span></div>
    <p class="tiny muted" style="text-align:center;margin-bottom:18px">社内向けです。招待されたアカウントでログインしてください。</p>
    <input id="gEmail" type="email" autocomplete="username" placeholder="メールアドレス">
    <input id="gPw" type="password" autocomplete="current-password" placeholder="パスワード">
    <button id="gBtn" class="btn p" type="submit" style="width:100%;margin-top:10px">ログイン</button>
    <div id="gateMsg" class="tiny" style="margin-top:12px;min-height:20px;color:var(--hot);text-align:center">読み込んでいます…</div>
  </form>
</div>

<div id="app" style="display:none">
<header class="top">
  <div class="top-in">
    <div class="brand"><b>Medixor</b><span>outbound&nbsp;pdca</span></div>
    <div style="flex:1;min-width:220px">
      <div class="rail" id="rail"></div>
      <div class="railcap" id="railcap" style="margin-top:5px"></div>
    </div>
    <div class="ring" style="text-align:right">
      <div class="rt" style="text-align:right"><b id="who" style="font-size:12px;font-weight:700"></b><br><span id="saved" style="font-size:10px;color:var(--ink3)"></span></div>
    </div>
    <div class="ring">
      <svg width="42" height="42" viewBox="0 0 42 42">
        <circle cx="21" cy="21" r="17" fill="none" stroke="#F3E6DA" stroke-width="5"/>
        <circle id="ringArc" cx="21" cy="21" r="17" fill="none" stroke="#2FD196" stroke-width="5"
                stroke-linecap="round" stroke-dasharray="0 107" transform="rotate(-90 21 21)"/>
      </svg>
      <div class="rt">本日の送信<br><b id="capNow">0</b> / <span id="capMax">25</span> 通</div>
    </div>
  </div>
  <nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
</header>

<main class="wrap">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-list"></section>
  <section class="view" id="v-stats"></section>
  <section class="view" id="v-review"></section>
  <section class="view" id="v-plan"></section>
</main>

</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dclose"><b id="dTitle">詳細</b><button class="btn s" onclick="closeDrawer()">閉じる ✕</button></div>
  <div class="dbody" id="dBody"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ═══ Supabase の接続先。ここだけ書き換えてください ═══ */
const CFG = {
  url: 'https://jnttziptsgajkagaffdf.supabase.co',
  key: 'ここに anon public キーを貼る'

const DATA = {"tpls":{"A":{"seg":"① 紹介経由","subject":"ご紹介いただきありがとうございます（Medixor／リアス株式会社 坂口）","body":"【　】先生\n\nはじめてご連絡いたします。Medixorを運営しております、リアス株式会社の坂口と申します。\n\nご登録の際に「【紹介／医師から聞いて 等の記載】」とご記入いただいており、まずそのお礼をお伝えしたくメールいたしました。ご紹介くださった方にも感謝しております。\n\nご登録から時間が経ってしまい、こちらから一度もご連絡できておりませんでした。失礼いたしました。\n\n★カテゴリ差込★\n\n【関西・関東】もしよろしければ、一度ご挨拶に伺えないでしょうか。診療の合間の15分でも構いません。\n【その他地域】もしよろしければ、一度15分ほどオンラインでお話しできればと思います。画面共有で価格表をお見せしながらご説明します。\n\n【来週の火曜・木曜午後】でしたら空いております。ご都合いかがでしょうか。\n\n────────────\nリアス株式会社\n代表取締役 坂口 孝太","why":"紹介経由は関係が壊れにくい唯一の層。1通目から面談を打診してよい。断られても失うものがない。全国254件中でも最も歩留まりが高い。"},"E":{"seg":"② 品質・信頼重視","subject":"正規品の流通経路についてご説明させてください（Medixor 坂口）","body":"【　】先生\n\nMedixorを運営しております、リアス株式会社の坂口と申します。\n\nご登録時に「【正規品／コールドチェーン／密封 等のご記載】」とご記入いただいておりました。この点は当社がいちばん力を入れている部分ですので、直接ご説明したくご連絡しました。\n\n【仕入経路・輸送温度管理・外箱の状態について、事実を3〜4行で。誇張しない】\n\nご懸念の点があれば、遠慮なくご質問ください。書面でお答えできることはすべてお出しします。\n\n★カテゴリ差込★\n\n【面談打診：訪問またはオンライン】\n\n────────────\nリアス株式会社\n代表取締役 坂口 孝太","why":"この層は価格勝負にならないため、単価と継続率がいちばん高くなる。他社への不信がすでに顕在化しているので、事実を丁寧に出すだけで乗り換えが起きる。全セグメント中もっとも投資対効果が高い。安売りの話を持ち出さないこと。"},"C":{"seg":"③ 乗り換え・比較","subject":"仕入先の比較検討をされていた件（Medixor 坂口）","body":"【　】先生\n\nMedixorを運営しております、リアス株式会社の坂口と申します。\n\nご登録時に「【比較したい／今の業者が高い／一括にまとめたい 等】」とご記入いただいておりました。\n\n比較検討の段階でしたら、いちばん確実なのは同じ条件で並べて見ることだと思います。現在お使いの仕入先のお見積りがございましたら、同じ製品・同じロットで当社の条件をお出しします。金額が合わなければ、それでけっこうです。\n\n複数社に分けて発注されている場合は、まとめた場合の条件も併せてお出しします。\n\n★カテゴリ差込★\n\n【面談打診：訪問またはオンライン】\n\n────────────\nリアス株式会社\n代表取締役 坂口 孝太","why":"「相見積もりを取ってください」と自分から言うのがいちばん効く。価格勝負の層なので、勝てないなら早く分かったほうが双方の時間を無駄にしない。「複数社の集約」は価格以外の価値提案になるので必ず入れる。"},"F":{"seg":"④ 開業・新規参入","subject":"美容メニューの立ち上げについて（Medixor 坂口）","body":"【　】先生\n\nMedixorを運営しております、リアス株式会社の坂口と申します。\n\nご登録時に「【開業準備／メニューを増やしたい 等】」とご記入いただいておりました。\n\n立ち上げの段階では、何をどの順で揃えるかがいちばん迷われるところかと思います。当社は同じ段階のクリニック様とのお取引が多く、初期に必要な製剤・消耗品の構成をご提案できます。小ロットからの対応も可能です。\n\n★カテゴリ差込★\n\n導入時の手続きや保管方法についても、ご不明な点があればお答えします。\n\n【面談打診：訪問またはオンライン】\n\n────────────\nリアス株式会社\n代表取締役 坂口 孝太","why":"今の発注額は小さいが、立ち上げ時に入った業者がそのまま定番になるためLTVが最大。価格ではなく「構成の提案 let REC=[], BYID={}, ME=null, lastSync=null, syncing=false;

/* ══ Supabase ═════════════════════════════════ */
const TOK='medixor:rt';
function hdr(extra){
  return Object.assign({apikey:CFG.key,'Content-Type':'application/json',
    Authorization:'Bearer '+(ME?ME.token:CFG.key)}, extra||{});
}
async function api(method,path,body,extra){
  const r=await fetch(CFG.url+'/rest/v1/'+path,{method,headers:hdr(extra),
    body:body?JSON.stringify(body):undefined});
  if(r.status===401){ signOut('セッションが切れました。もう一度ログインしてください。'); throw new Error('401'); }
  if(!r.ok) throw new Error(await r.text());
  const t=await r.text(); return t?JSON.parse(t):null;
}
const upsert=(tbl,rows)=>api('POST',tbl,rows,{Prefer:'resolution=merge-duplicates,return=minimal'});

async function signIn(email,pw){
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type=password',
    {method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},
     body:JSON.stringify({email,password:pw})});
  const j=await r.json();
  if(!j.access_token) throw new Error(j.error_description||j.msg||j.message||'ログインできませんでした');
  setSession(j); return j;
}
async function refresh(){
  let rt=null; try{ rt=localStorage.getItem(TOK) }catch(e){}
  if(!rt) return false;
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token',
    {method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},
     body:JSON.stringify({refresh_token:rt})});
  const j=await r.json();
  if(!j.access_token){ try{localStorage.removeItem(TOK)}catch(e){}; return false; }
  setSession(j); return true;
}
function setSession(j){
  const md=j.user&&j.user.user_metadata||{};
  ME={token:j.access_token,email:(j.user&&j.user.email)||'',
      name:md.name||((j.user&&j.user.email)||'').split('@')[0]};
  try{ localStorage.setItem(TOK,j.refresh_token) }catch(e){}
  clearTimeout(setSession._t);
  setSession._t=setTimeout(refresh,Math.max(60,(j.expires_in||3600)-120)*1000);
}
function signOut(msg){
  ME=null; try{ localStorage.removeItem(TOK) }catch(e){}
  document.getElementById('gate').style.display='flex';
  document.getElementById('app').style.display='none';
  if(msg) document.getElementById('gateMsg').textContent=msg;
}

/* 「今日」タブの表示。戻したくなったら true に変えるだけ */
const SHOW_TODAY = false;

/* ══ dates ════════════════════════════════════ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=iso(new Date());
function addD(s,n){ if(!s)return''; const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function diffD(a,b){ if(!a||!b)return 0; return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5); }
function jp(s){ if(!s)return'—'; const[,m,d]=s.split('-'); return +m+'/'+d; }
function weekKey(s){
  const d=new Date(s+'T00:00:00'); const t=new Date(d);
  t.setDate(t.getDate()+3-((d.getDay()+6)%7));
  const y=t.getFullYear(); const j=new Date(y,0,4);
  const w=1+Math.round(((t-j)/864e5-3+((j.getDay()+6)%7))/7);
  return y+'-W'+pad(w);
}
function weekMonday(s){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); }

/* ══ state ════════════════════════════════════ */
const STATUSES=['未着手','1通目送信','2通目送信','3通目送信','返信あり','電話済','面談打診中','面談実施','見積提出','受注','不要連絡','寝かせ','対象外'];
const CLOSED=['受注','不要連絡','対象外','寝かせ'];
let S={v:1,start:TODAY,cap:25,company:'',sender:'',title:'',r:{},weeks:{},del:[]};
let dirty=false;

function st(id){
  if(!S.r[id]){
    const rec=BYID[id];
    const off = (rec.seg==='除外'||rec.seg==='★ 別対応') ? '対象外' : '未着手';
    S.r[id]={st:off,s1:'',s2:'',s3:'',call:'',last:'',own:'',mode:'',snooze:'',memo:'',log:[],d:{}};
  }
  return S.r[id];
}
let dirtyRecs=new Set(), dirtyMeta=false;
function touch(id){
  if(id){dirtyRecs.add(id)}else{dirtyMeta=true}
  dirty=true; setSaved('保存中…');
  clearTimeout(touch._t); touch._t=setTimeout(save,700);
}
async function save(){
  const ids=[...dirtyRecs]; dirtyRecs.clear();
  const meta=dirtyMeta; dirtyMeta=false; dirty=false;
  try{
    if(ids.length) await upsert('medixor_state',
      ids.map(id=>({id,data:S.r[id],updated_by:ME?ME.name:'',updated_at:new Date().toISOString()})));
    if(meta) await upsert('medixor_meta',[
      {k:'settings',data:{start:S.start,cap:S.cap,company:S.company,sender:S.sender,title:S.title},updated_at:new Date().toISOString()},
      {k:'weeks',data:S.weeks,updated_at:new Date().toISOString()}]);
    setSaved('保存済み '+new Date().toTimeString().slice(0,5));
  }catch(e){
    ids.forEach(i=>dirtyRecs.add(i)); if(meta)dirtyMeta=true; dirty=true;
    setSaved('保存できていません — 通信を確認してください',1);
  }
}
function setSaved(t,bad){
  const el=document.getElementById('saved'); if(!el)return;
  el.textContent=t; el.style.color=bad?'var(--hot)':'var(--ink3)';
}
function logIt(id,kind,note){ st(id).log.push({d:TODAY,k:kind,n:note||''}); }

/* ══ engine ═══════════════════════════════════ */
function waveStart(w){ return addD(S.start, w===1?0 : w===2?21 : w===3?56 : 0); }
function waveEnd(w){ return addD(S.start, w===1?20 : w===2?55 : 83); }
function weekNo(){ const n=diffD(S.start,TODAY); return Math.max(1,Math.min(12,Math.floor(n/7)+1)); }

/* 次アクション：どのタイミングで何をするかの唯一の定義 */
function next(rec){
  const x=st(rec.id);
  if(CLOSED.includes(x.st)) return null;
  if(x.snooze && x.snooze>TODAY) return {act:'保留中',due:x.snooze,kind:'hold',heat:0};
  switch(x.st){
    case '未着手':     return {act:'1通目を送る',   due:waveStart(rec.wave), kind:'m1',   heat:1};
    case '1通目送信':  return {act:'2通目を送る',   due:addD(x.s1,5),        kind:'m2',   heat:1};
    case '2通目送信':  return {act:'3通目を送る',   due:addD(x.s1,14),       kind:'m3',   heat:1};
    case '3通目送信':  return {act:'寝かせる',      due:addD(x.s3,7),        kind:'sleep',heat:0};
    case '返信あり':   return {act:'当日中に電話',  due:x.last||TODAY,       kind:'call', heat:3};
    case '電話済':     return {act:'面談を打診',    due:addD(x.last,1),      kind:'meet', heat:2};
    case '面談打診中': return {act:'返事を確認',    due:addD(x.last,3),      kind:'follow',heat:2};
    case '面談実施':   return {act:'見積を出す',    due:addD(x.last,2),      kind:'quote',heat:2};
    case '見積提出':   return {act:'クロージング',  due:addD(x.last,5),      kind:'close',heat:2};
  }
  return null;
}
function queue(){
  const q=[];
  for(const rec of REC){
    const n=next(rec); if(!n||n.kind==='hold')continue;
    q.push({rec,n,late:n.due<TODAY?diffD(n.due,TODAY):0});
  }
  q.sort((a,b)=> b.n.heat-a.n.heat || a.n.due.localeCompare(b.n.due) || (a.rec.pri||9)-(b.rec.pri||9));
  return q;
}
const sentToday=()=>REC.reduce((a,r)=>a+st(r.id).log.filter(l=>l.d===TODAY&&l.k[0]==='m').length,0);

/* ══ mail composer ════════════════════════════ */
const VISIT=['関東','関西','中部'];
function resolveRegion(body,blk){
  const lines=body.split('\n');
  const marks=[];
  lines.forEach((l,i)=>{ const m=l.match(/^【([^】]+)】/); if(m&&/(関東|関西|中部|その他地域)/.test(m[1])) marks.push({i,set:m[1]}); });
  if(marks.length){
    let keep=marks.find(m=>m.set.split(/[・、]/).includes(blk));
    if(!keep) keep=marks.find(m=>m.set.includes('その他地域'))||marks[0];
    marks.forEach(m=>{ lines[m.i] = (m.i===keep.i) ? lines[m.i].replace(/^【[^】]+】/,'') : null; });
  }
  let out=lines.filter(l=>l!==null).join('\n');
  const visit=VISIT.includes(blk);
  out=out.replace('【面談打診：訪問またはオンライン】', visit
    ? 'もしよろしければ、一度ご挨拶に伺えないでしょうか。診療の合間の15分でも構いません。ご都合のよい曜日をお知らせいただければ、そちらに合わせます。'
    : 'もしよろしければ、15分ほどオンラインでお時間をいただけないでしょうか。価格表を画面共有しながらご説明します。');
  return out;
}

function pickQuote(rec,key){
  const why=(rec.why||'').replace(/\s+/g,' '), kw=(rec.kw||'').replace(/\s+/g,' ');
  if(key==='A'){ const ref=/紹介|聞い|勧め|知人|友人|同僚|医師/;
    if(ref.test(why))return why; if(ref.test(kw))return kw; }
  if(key==='B'||key==='B-歯科') return kw||why;
  return why||kw;
}
/* 件名に入れる製品名：長すぎるときは先頭の語だけ */
function pickProduct(rec){
  let p=(rec.kw||'').replace(/\s+/g,' ').trim();
  if(!p||/^(紹介|ネット検索|検索|chatGPT)$/i.test(p)) p = rec.cat!=='未特定'?rec.cat:'';
  if(p.length>18){ const first=p.split(/[ 、,／\/・]/).filter(Boolean)[0]||p; p=first.length<=18?first:p.slice(0,18); }
  return p;
}
/* 差出人・社名：未設定なら【　】として残し、要記入に数える */
function signOff(txt){
  const n=(S.sender||'').trim(), t=(S.title||'').trim(), co=(S.company||'').trim();
  if(n){
    const last=n.split(/[ \u3000]/)[0];
    txt=txt.replace(/代表取締役 坂口 孝太/g,(t?t+' ':'')+n)
           .replace(/坂口 孝太/g,n).replace(/坂口/g,last);
  }else{
    txt=txt.replace(/代表取締役 坂口 孝太/g,'【役職・氏名】')
           .replace(/坂口 孝太/g,'【氏名】').replace(/坂口/g,'【担当者名】');
  }
  return txt.replace(/リアス株式会社/g, co||'【会社名】');
}
function compose(rec,which){
  const x=st(rec.id);
  if(x.d&&x.d[which]) return x.d[which];
  const key = which===1 ? (DATA.tpls[rec.tpl]?rec.tpl:'D') : (which===2?'2通目':'3通目');
  const t=DATA.tpls[key];
  let subj=t.subject, body=t.body;
  const quote=pickQuote(rec,key);
  const prod=pickProduct(rec);
  body=body.replace(/【[\s\u3000]*】/,(rec.rep||rec.pic||''));
  body=body.replace(/「【[^】]*】」/, quote?('「'+quote+'」'):'「（ご登録時のご記入内容）」');
  subj=subj.replace('【製品名】', prod||'お問い合わせいただいた製品');
  const cb=(DATA.cats[rec.cat]||DATA.cats['未特定']).block;
  body=body.replace('★カテゴリ差込★',cb);
  body=resolveRegion(body,rec.blk);
  return {subj:signOff(subj),body:signOff(body),tpl:key};
}
const blanks=t=>(t.match(/【[^】]*】/g)||[]).length;

function setStatus(id,to,note){
  if(!to)return;
  const x=st(id);
  x.st=to; x.last=TODAY;
  if(to==='1通目送信'){x.s1=TODAY;logIt(id,'m1',note)}
  else if(to==='2通目送信'){x.s2=TODAY;logIt(id,'m2',note)}
  else if(to==='3通目送信'){x.s3=TODAY;logIt(id,'m3',note)}
  else if(to==='返信あり')logIt(id,'reply',note);
  else if(to==='電話済'){x.call=TODAY;logIt(id,'call',note)}

let lastDel=null;
async function purge(id){                     /* 共有版：Supabase から実際に削除 */
  dirtyRecs.delete(id);
  await api('DELETE','medixor_state?id=eq.'+encodeURIComponent(id));
  await api('DELETE','medixor_lead?id=eq.'+encodeURIComponent(id));
}
async function unpurge(id){
  const {id:_x,...data}=BYID[id];
  await upsert('medixor_lead',[{id,data,updated_at:new Date().toISOString()}]);
  if(S.r[id]) await upsert('medixor_state',[{id,data:S.r[id],updated_by:ME?ME.name:'',updated_at:new Date().toISOString()}]);
}
function dropLocal(id){ REC=REC.filter(x=>x.id!==id); delete BYID[id]; }
async function delRec(id){
  const r=BYID[id]; if(!r)return;
  if(!confirm(r.name+'（#'+r.id+'）を名簿から削除します。\n\n進捗・メモ・下書き・履歴もまとめて消えます。\n元に戻せるのは、削除直後に出る「取り消す」を押した場合だけです。\n\n削除しますか？'))return;
  lastDel={rec:r,state:S.r[id]};
  dropLocal(id); delete S.r[id];
  try{ await purge(id); }catch(e){ toast('削除できませんでした'); return; }
  closeDrawer(); render(); undoToast(r.name+' を削除しました');
}
async function undoDel(){
  if(!lastDel)return;
  const {rec,state}=lastDel; lastDel=null;
  REC.push(rec); REC.sort((a,b)=>a.id.localeCompare(b.id));
  BYID[rec.id]=rec; if(state)S.r[rec.id]=state; else st(rec.id);
  try{ await unpurge(rec.id); }catch(e){ toast('元に戻せませんでした'); }
  touch(rec.id); render(); toast('元に戻しました');
}
function undoToast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=esc(msg)+' <button onclick="undoDel()" style="margin-left:14px;color:var(--sun);font-weight:800;text-decoration:underline;pointer-events:auto">取り消す</button>';
  t.classList.add('on'); t.style.pointerEvents='auto';

/* ══ render: 数字 ═════════════════════════════ */
function grp(keyFn){
  const m={};
  REC.forEach(r=>{
    const x=st(r.id); if(x.st==='対象外')return;
    const k=keyFn(r)||'—';
    m[k]=m[k]||{n:0,sent:0,reply:0,meet:0,won:0,ng:0};
    const g=m[k]; g.n++;
    if(x.s1)g.sent++;
    if(x.log.some(l=>l.k==='reply'))g.reply++;
    if(['面談実施','見積提出','受注'].includes(x.st))g.meet++;
    if(x.st==='受注')g.won++;
    if(x.st==='不要連絡')g.ng++;
  });
  return m;
}
function rateTable(title,keyFn,note){
  const m=grp(keyFn);
  const ks=Object.keys(m).sort((a,b)=>m[b].sent-m[a].sent||m[b].n-m[a].n);
  const max=Math.max(...ks.map(k=>m[k].sent?m[k].reply/m[k].sent:0),.001);
  let h=`<details class="acc" open><summary>${esc(title)}<span class="tiny muted" style="font-weight:400">${esc(note||'')}</span></summary><div class="accb" style="overflow-x:auto"><table class="t"><thead><tr>
    <th>${esc(title.split('別')[0])}</th><th class="n">対象</th><th class="n">送信</th><th class="n">返信</th><th class="n">返信率</th><th style="width:130px"></th><th class="n">商談</th><th class="n">受注</th><th class="n">不要</th></tr></thead><tbody>`;
  ks.forEach(k=>{
    const g=m[k], rate=g.sent?g.reply/g.sent:0;
    h+=`<tr><td>${esc(k)}</td><td class="n muted">${g.n}</td><td class="n">${g.sent}</td><td class="n">${g.reply}</td>
      <td class="n"><b>${g.sent?(rate*100).toFixed(1)+'%':'—'}</b></td>
      <td><div class="bar"><i class="${g.sent<5?'low':''}" style="width:${Math.min(100,rate/max*100)}%"></i></div></td>
      <td class="n">${g.meet}</td><td class="n">${g.won}</td><td class="n muted">${g.ng}</td></tr>`;
  });
  return h+`</tbody></table><div class="tiny muted" style="margin-top:8px">送信5件未満は薄いバーで表示しています。母数が少ないうちは差を読まないでください。</div></div></details>`;
}

  const cnt=days.map(d=>REC.reduce((a,r)=>a+st(r.id).log.filter(l=>l.d===d&&l.k[0]==='m').length,0));
  const mx=Math.max(S.cap,...cnt);

/* ══ render: ふりかえり ═══════════════════════ */
function weekSnap(mon){
  const sun=addD(mon,6);
  const inW=d=>d>=mon&&d<=sun;
  let m=0,rp=0,cl=0,mt=0,ng=0;
  REC.forEach(r=>st(r.id).log.forEach(l=>{ if(!inW(l.d))return;
    if(l.k[0]==='m')m++; else if(l.k==='reply')rp++; else if(l.k==='call')cl++;
    else if(l.k==='st'&&/面談実施|見積提出|受注/.test(l.n))mt++;
    else if(l.k==='st'&&/不要連絡/.test(l.n))ng++; }));
  return {m,rp,cl,mt,ng};
}

/* ══ export ═══════════════════════════════════ */
function dl(name,txt,mime){
  const b=new Blob([txt],{type:mime||'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('書き出しました');
}
function exportJSON(){ dl('medixor-pdca-'+TODAY+'.json',JSON.stringify(S),'application/json'); }
function exportCSV(){
  const cols=['会員ID','施設名','都道府県','市区町村','地域','セグメント','カテゴリ','業態','テンプレ','波','代表者','担当者','メール','電話','登録日','状況','1通目','2通目','3通目','電話日','次アクション','期限','メモ'];
  const rows=filtered().map(r=>{ const x=st(r.id),n=next(r);
    return [r.id,r.name,r.pref,r.city,r.blk,r.seg,r.cat,r.biz,r.tpl,r.wave,r.rep,r.pic,r.mail,r.tel,r.reg,x.st,x.s1,x.s2,x.s3,x.call,n?n.act:'',n?n.due:'',(x.memo||'').replace(/\n/g,' ')]; });
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  dl('medixor-list-'+TODAY+'.csv','\ufeff'+[cols,...rows].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}

/* ══ 同期：他メンバーの更新を取り込む ═════════ */
async function pull(first){
  if(syncing||!ME)return; syncing=true;
  try{
    if(first){
      const leads=await api('GET','medixor_lead?select=id,data&order=id');
      REC=leads.map(l=>Object.assign({id:l.id},l.data));
      BYID=Object.fromEntries(REC.map(r=>[r.id,r]));
      const meta=await api('GET','medixor_meta?select=k,data');
      (meta||[]).forEach(m=>{ if(m.k==='settings')Object.assign(S,m.data); if(m.k==='weeks')S.weeks=m.data||{}; });
    }
    const q='medixor_state?select=id,data,updated_at'+(lastSync?'&updated_at=gt.'+encodeURIComponent(lastSync):'');
    const rows=await api('GET',q);
    let changed=0;
    (rows||[]).forEach(r=>{
      if(dirtyRecs.has(r.id))return;              /* 自分の未保存分は上書きしない */
      S.r[r.id]=r.data; changed++;
      if(!lastSync||r.updated_at>lastSync)lastSync=r.updated_at;
    });
    if(first){ REC.forEach(r=>st(r.id)); render(); }
    else if(changed && !typing()){ render(); setSaved('他メンバーの更新を '+changed+' 件反映'); }
  }catch(e){ if(first)throw e; }
  finally{ syncing=false; }
}
const typing=()=>{ const a=document.activeElement; return a&&/TEXTAREA|INPUT/.test(a.tagName); };

/* ══ 名簿の取り込み（初回のみ） ═══════════════ */
async function seedLeads(el){
  const f=el.files[0]; el.value=''; if(!f)return;
  try{
    const arr=JSON.parse(await f.text());
    if(!Array.isArray(arr)||!arr[0]||!arr[0].id) throw new Error('medixor-leads.json を選んでください');
    setSaved('名簿を取り込み中… 0 / '+arr.length);
    for(let i=0;i<arr.length;i+=50){
      const chunk=arr.slice(i,i+50).map(r=>{ const {id,...rest}=r; return {id:String(id),data:rest}; });
      await upsert('medixor_lead',chunk);
      setSaved('名簿を取り込み中… '+Math.min(i+50,arr.length)+' / '+arr.length);
    }
    toast(arr.length+'件を取り込みました');
    lastSync=null; await pull(true);
  }catch(e){ setSaved('取り込みに失敗しました：'+e.message,1); }
}

/* ══ chrome ═══════════════════════════════════ */
const TABS=[['today','今日'],['list','名簿'],['stats','数字'],['review','ふりかえり'],['plan','計画']]
  .filter(t=>t[0]!=='today'||SHOW_TODAY);
let TAB=TABS[0][0];
function renderTabs(){
  const q=queue(); const todo=q.filter(o=>o.n.due<=TODAY).length; const late=q.filter(o=>o.n.due<TODAY).length;
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>
    `<button class="tab ${TAB===k?'on':''}" onclick="go('${k}')">${l}${k==='today'&&todo?`<em class="${late?'hot':''}">${todo}</em>`:''}${k==='list'?`<em class="${!SHOW_TODAY&&late?'hot':''}">${!SHOW_TODAY&&todo?todo+' / ':''}${REC.length}</em>`:''}</button>`).join('');
}
function renderRail(){
  const w=weekNo();
  document.getElementById('rail').innerHTML=[...Array(12)].map((_,i)=>{
    const n=i+1, wv=n<=3?1:n<=8?2:3;
    return `<i class="w${wv} ${n<w?'past':''} ${n===w?'now':''}" title="第${n}週／第${wv}波"></i>`;}).join('');
  document.getElementById('railcap').textContent=`第${w}週 / 12　—　${jp(S.start)} 開始　·　いまは第${w<=3?1:w<=8?2:3}波`;
  const cap=sentToday(), pctv=Math.min(1,cap/Math.max(1,S.cap));
  const arc=document.getElementById('ringArc');
  arc.setAttribute('stroke-dasharray',(pctv*106.8).toFixed(1)+' 106.8');
  arc.setAttribute('stroke',cap>S.cap?'#FF3D71':'#2FD196');
  arc.setAttribute('opacity',cap?1:0);
  document.getElementById('capNow').textContent=cap;
  document.getElementById('capMax').textContent=S.cap;
}
function go(k){ if(k==='today'&&!SHOW_TODAY)k='list'; TAB=k; document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+k)); render(); window.scrollTo({top:0,behavior:'instant'}); }
function autosize(){
  document.querySelectorAll('.mailbox .bodyta').forEach(t=>{ t.style.height='auto'; t.style.height=Math.max(340,t.scrollHeight+6)+'px'; });
}
function render(){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+TAB));
  renderTabs(); renderRail();
  if(TAB==='today'&&SHOW_TODAY)viewToday();
  else if(TAB==='list'||TAB==='today')viewList();
  else if(TAB==='stats')viewStats();
  else if(TAB==='review')viewReview();
  else viewPlan();
  autosize();
}
window.addEventListener('beforeunload',()=>{ if(dirty)save(); });

async function boot(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='';
  document.getElementById('who').textContent=ME.name;
  await pull(true);
  if(!REC.length){
    document.getElementById('v-'+TAB).innerHTML=
      '<div class="card empty"><div style="font-weight:700;color:var(--ink)">名簿がまだ入っていません</div>'+
      '<div class="tiny" style="margin-top:8px">計画タブの設定から <b>medixor-leads.json</b> を取り込んでください。最初の一度だけの作業です。</div></div>';
  }
  clearInterval(boot._p); boot._p=setInterval(()=>pull(false),20000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden)pull(false) });
}
async function doLogin(){
  const e=document.getElementById('gEmail').value.trim(), p=document.getElementById('gPw').value;
  const msg=document.getElementById('gateMsg'), btn=document.getElementById('gBtn');
  if(!e||!p){ msg.textContent='メールアドレスとパスワードを入れてください'; return; }
  btn.disabled=true; msg.textContent='確認しています…';
  try{ await signIn(e,p); await boot(); }
  catch(err){ msg.textContent=err.message; btn.disabled=false; }
}
(async function init(){
  if(/XXXX/.test(CFG.url)||/XXXX/.test(CFG.key)){
    document.getElementById('gateMsg').textContent='CFG の url と key がまだ未設定です。index.html の先頭を書き換えてください。';
    return;
  }
  document.getElementById('gPw').addEventListener('keydown',ev=>{ if(ev.key==='Enter')doLogin() });
  try{ if(await refresh()){ await boot(); return; } }catch(e){}
  document.getElementById('gateMsg').textContent='';
  document.getElementById('gEmail').focus();
})();
